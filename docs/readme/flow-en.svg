<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="302" viewBox="0 0 1040 302" role="img" aria-labelledby="title"><title id="title">Your app sends a value. Cosy replaces it before forwarding. If the LLM returns the known token unchanged, Cosy restores the original for your app.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#17132D"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#B4A1FF"/><stop offset="1" stop-color="#77E8C4"/></linearGradient></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="0" y="0" width="1040" height="302" rx="18" fill="#111827"/><text x="27" y="36" font-size="12" font-weight="650" fill="#A8A3C5" letter-spacing="2">THE ROUND TRIP</text><text x="720" y="36" font-size="12" font-weight="400" fill="#A9B6CA" >Deploy Cosy where you trust it.</text><rect x="27" y="57" width="228" height="78" rx="12" fill="#1B2535" stroke="#344057"/><text x="43" y="88" font-size="19" font-weight="650" fill="#F3F5FB" >Your app</text><text x="43" y="112" font-size="11" font-weight="400" fill="#B5C1D4" >Prompts · tool results</text><rect x="406" y="57" width="228" height="78" rx="12" fill="#1B2535" stroke="#344057"/><text x="422" y="88" font-size="19" font-weight="650" fill="#F3F5FB" >Cosy gateway</text><text x="422" y="112" font-size="11" font-weight="400" fill="#B5C1D4" >Request-scoped mapping</text><rect x="785" y="57" width="228" height="78" rx="12" fill="#1B2535" stroke="#344057"/><text x="801" y="88" font-size="19" font-weight="650" fill="#F3F5FB" >Upstream LLM</text><text x="801" y="112" font-size="11" font-weight="400" fill="#B5C1D4" >Receives matched-value tokens</text><path d="M269 82H384m-7-5 7 5-7 5" fill="none" stroke="#AA97F3" stroke-width="2"/><path d="M392 112H277m7-5-7 5 7 5" fill="none" stroke="#84DFC0" stroke-width="2"/><path d="M648 82H763m-7-5 7 5-7 5" fill="none" stroke="#AA97F3" stroke-width="2"/><path d="M771 112H656m7-5-7 5 7 5" fill="none" stroke="#84DFC0" stroke-width="2"/><text x="287" y="75" font-size="12" font-weight="400" fill="#C6B5FF" >redact</text><text x="670" y="75" font-size="12" font-weight="400" fill="#C6B5FF" >forward</text><text x="286" y="132" font-size="12" font-weight="400" fill="#8FE7C7" >restore</text><text x="674" y="132" font-size="12" font-weight="400" fill="#8FE7C7" >return</text><rect x="27" y="159" width="986" height="56" rx="10" fill="#1B2233"/><text x="43" y="181" font-size="10" font-weight="650" fill="#BDA8F8" letter-spacing="1">REQUEST</text><text x="43" y="202" font-size="14" font-weight="400" fill="#EBEAF5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">alice@example.com</text><text x="408" y="194" font-size="14" font-weight="600" fill="#CEBFF8" >Detect → replace</text><text x="789" y="194" font-size="15" font-weight="400" fill="#CFBEFF" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">{{Redact:…}}</text><rect x="27" y="226" width="986" height="56" rx="10" fill="#162B2B"/><text x="43" y="249" font-size="10" font-weight="650" fill="#90E7C7" letter-spacing="1">RESPONSE</text><text x="43" y="270" font-size="14" font-weight="400" fill="#E4F6EF" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">alice@example.com</text><text x="408" y="262" font-size="14" font-weight="600" fill="#9AE8CD" >Known token → original</text><text x="789" y="262" font-size="15" font-weight="400" fill="#ADEBD5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">{{Redact:…}}</text></g></svg>