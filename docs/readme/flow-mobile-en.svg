<svg xmlns="http://www.w3.org/2000/svg" width="560" height="446" viewBox="0 0 560 446" role="img" aria-labelledby="title"><title id="title">App, trusted Cosy gateway, upstream LLM. Outbound matched values are tokenized; returned known tokens are restored.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#17132D"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#B4A1FF"/><stop offset="1" stop-color="#77E8C4"/></linearGradient></defs><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="0" y="0" width="560" height="446" rx="18" fill="#111827"/><text x="26" y="38" font-size="13" font-weight="650" fill="#A8A3C5" letter-spacing="2">THE ROUND TRIP</text><rect x="26" y="60" width="508" height="85" rx="12" fill="#1B2535" stroke="#344057"/><text x="44" y="91" font-size="21" font-weight="650" fill="#F0F3FA" >01  Your app</text><text x="44" y="122" font-size="18" font-weight="400" fill="#C9B6FF" >alice@example.com</text><path d="M230 148v19m-5-5 5 5 5-5" fill="none" stroke="#BDA3FF" stroke-width="2"/><path d="M330 168v-19m-5 5 5-5 5 5" fill="none" stroke="#91E5C7" stroke-width="2"/><rect x="26" y="171" width="508" height="85" rx="12" fill="#1B2535" stroke="#344057"/><text x="44" y="202" font-size="21" font-weight="650" fill="#F0F3FA" >02  Cosy gateway</text><text x="44" y="233" font-size="18" font-weight="400" fill="#93E6C6" >Detect → replace → restore</text><path d="M230 259v19m-5-5 5 5 5-5" fill="none" stroke="#BDA3FF" stroke-width="2"/><path d="M330 279v-19m-5 5 5-5 5 5" fill="none" stroke="#91E5C7" stroke-width="2"/><rect x="26" y="282" width="508" height="85" rx="12" fill="#1B2535" stroke="#344057"/><text x="44" y="313" font-size="21" font-weight="650" fill="#F0F3FA" >03  Upstream LLM</text><text x="44" y="344" font-size="18" font-weight="400" fill="#C9B6FF" >{{Redact:…}}</text><text x="28" y="404" font-size="17" font-weight="400" fill="#C9B6FF" >↓ Redacted request</text><text x="302" y="404" font-size="17" font-weight="400" fill="#93E6C6" >↑ Restored reply</text><text x="28" y="433" font-size="13" font-weight="400" fill="#ADBBD0" >Known tokens must be returned unchanged.</text></g></svg>